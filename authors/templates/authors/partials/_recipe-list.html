{% comment %}
    Item da lista de receitas do dashboard do autor.
    O link de edição e o formulário de exclusão ficam lado a lado
    (um <form> dentro de <a> é HTML inválido).
{% endcomment %}
<div class="recipe-dashboard flex items-center gap-3 rounded-2xl border border-line bg-surface p-2 pl-4 transition-colors hover:border-line-strong">
    <div class="recipe-title-container min-w-0 flex-1">
        <a href="{% url "recipes:recipe_update" recipe.pk %}"
           class="group flex min-h-11 items-center gap-3 rounded-lg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
            <span class="shrink-0 rounded-md bg-raised px-2 py-0.5 font-mono text-xs text-fg-subtle">{{recipe.pk}}</span>
            <p class="recipe-title truncate font-medium text-fg transition-colors group-hover:text-accent"><span class="sr-only">{{recipe.pk}} - </span>{{recipe.title}}</p>
            <i class="fa-solid fa-pen ml-auto text-xs text-fg-subtle transition-colors group-hover:text-accent" aria-hidden="true"></i>
        </a>
    </div>
    <form action="{% url "recipes:recipe_delete" %}" method="POST" class="inline-form"
        onsubmit="return confirm('Tem certeza que deseja excluir esta receita?');">
        {% csrf_token %}
        <input type="hidden" name="pk" value="{{ recipe.pk }}" >
        <button type="submit" class="plaintext-button grid size-11 cursor-pointer place-items-center rounded-xl text-fg-subtle transition-colors hover:bg-danger/10 hover:text-danger focus-visible:outline-2 focus-visible:outline-danger"
                aria-label="Excluir receita {{ recipe.title }}" title="Excluir">
            <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
        </button>
    </form>
</div>
