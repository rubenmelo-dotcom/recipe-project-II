    {% if messages %}
        <div class="main-content messages-container mx-auto mt-6 flex w-full max-w-2xl flex-col gap-3 px-4 sm:px-6" role="status">
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
